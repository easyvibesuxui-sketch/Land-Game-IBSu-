name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/devices-showroom-site-amc4re]
  workflow_dispatch:

# Pages serves this project repo from /Land-Game-IBSu-/, so the build needs the
# base path both for Next's own URLs and for the asset URLs inside the SVGs.
env:
  STATIC_EXPORT: "true"
  NEXT_PUBLIC_BASE_PATH: /Land-Game-IBSu-

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not already.
          enablement: true

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
